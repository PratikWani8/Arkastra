services:
  mongodb:
    image: mongo:7.0
    container_name: arkastra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: arkastra
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: arkastra-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./ml-service/reports:/app/ml-service/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arkastra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/arkastra
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=arkastra_production_secret_key_solar_2026_xray
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
      - ./ml-service/reports:/ml-service/reports:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arkastra-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
    driver: local
